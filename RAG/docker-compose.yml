version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC API (opcional)
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

# Uso:
# 1. Iniciar: docker-compose up -d
# 2. Ver logs: docker-compose logs -f qdrant
# 3. Detener: docker-compose down
# 4. Limpiar datos: docker-compose down -v
